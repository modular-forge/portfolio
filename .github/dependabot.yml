version: 2
updates:
  # Actions and the ci-web reference (pinned by SHA, with the tag in a comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing a newly published version (security updates do not wait).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  # npm dependencies. Major versions are done by hand (ng update applies migrations).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing a newly published version (security updates do not wait).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular']
      others:
        patterns: ['*']
