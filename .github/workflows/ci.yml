name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # On PRs a new run cancels the previous one; on main a deployment is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    uses: modular-forge/ci-web/.github/workflows/web.yml@e7c85b3272bbf9c2ac9b7290ff8be322f5d86446 # v1.0.0
    permissions:
      contents: read # check out the code
      id-token: write # the deploy job joins Tailscale with workload identity federation
    secrets:
      # Only exists in the production environment; ci-web reads it in the deploy job.
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    with:
      site: portfolio
      dist: dist/portfolio/browser
      url: https://modular-forge.dev
      ts-oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
      ts-audience: ${{ vars.TS_AUDIENCE }}
      known-hosts: ${{ vars.FORGE_KNOWN_HOSTS }}
